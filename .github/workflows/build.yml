name: Validate WindUI Rework

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parse all Luau sources
        run: node tools/check_syntax.mjs

      - name: Verify dist/main.lua is up to date
        run: python3 tools/bundle.py --check

      - name: Show bundle info
        run: wc -c dist/main.lua
